[package]
name = "lumen"
version = "0.2.4"
description = "A video player for macOS"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
name = "lumen_lib"
path = "src/lib.rs"

[[bin]]
name = "lumen"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "0.0.15"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.13"
rusqlite = { version = "0.42", features = ["bundled"] }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs", "net"] }
# Casting: finding devices, talking to them, and serving them the film.
mdns-sd = "0.21"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
getrandom = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
# Speech recognition for syncing subtitles, on the GPU through Metal.
whisper-rs = { version = "0.16", features = ["metal", "tracing_backend"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-quartz-core = { version = "0.3", features = ["objc2-open-gl", "objc2-core-video"] }
objc2-open-gl = "0.3"
objc2-core-video = "0.3"
libc = "0.2"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
block2 = "0.6"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media"] }
objc2-av-kit = "0.3"
objc2-core-media = "0.3"

[dev-dependencies]
rcgen = "0.14"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"
panic = "abort"
